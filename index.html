<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎵 SongStream · Player estilo Spotify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0a0a0f 0%, #0c0c12 100%);
      font-family: 'Inter', sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .player-container {
      max-width: 1400px;
      width: 100%;
      background: rgba(18, 18, 24, 0.7);
      backdrop-filter: blur(18px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .header {
      padding: 1.5rem 2rem;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-area i {
      font-size: 2rem;
      color: #1db954;
    }

    .logo-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #b3b3b3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .folder-control {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .folder-btn {
      background: #2a2a32;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .folder-btn:hover {
      background: #3a3a44;
      transform: scale(1.02);
    }

    .folder-btn i {
      color: #1db954;
    }

    .info-badge {
      background: rgba(0, 0, 0, 0.6);
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #ccc;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0;
      min-height: 550px;
    }

    .playlist-section {
      background: rgba(10, 10, 14, 0.6);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.2rem 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .playlist-header {
      padding: 0 1.5rem 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .playlist-header h3 {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-count {
      font-size: 0.75rem;
      background: #1f1f28;
      padding: 4px 8px;
      border-radius: 30px;
    }

    .search-box {
      margin: 0 1.5rem 1rem 1.5rem;
      background: #1e1e26;
      border-radius: 32px;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 8px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      width: 100%;
      font-size: 0.85rem;
    }

    .playlist-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem 0.5rem 0;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.7rem 1.5rem;
      margin: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .playlist-item.active {
      background: rgba(29, 185, 84, 0.2);
      border-left: 3px solid #1db954;
    }

    .track-name {
      font-weight: 500;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.7rem;
      color: #aaa;
    }

    .player-area {
      padding: 2rem 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .album-art {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .art-circle {
      width: 180px;
      height: 180px;
      background: linear-gradient(145deg, #23232e, #17171f);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
    }

    .art-circle i {
      font-size: 5rem;
      color: #1db954;
    }

    .track-details {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .current-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      margin: 1rem 0;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #e6e6e6;
      font-size: 1.3rem;
      cursor: pointer;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .play-btn {
      background: #1db954;
      color: black;
      font-size: 1.6rem;
      width: 56px;
      height: 56px;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
    }

    .volume-slider {
      width: 120px;
    }

    .status-msg {
      text-align: center;
      font-size: 0.75rem;
      margin-top: 1rem;
      color: #8a8a94;
    }

    @media (max-width: 800px) {
      .main-grid { grid-template-columns: 1fr; }
      .playlist-section { border-right: none; max-height: 280px; }
      .current-title { font-size: 1.2rem; white-space: normal; }
      .art-circle { width: 130px; height: 130px; }
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: #3a3a44;
      border-radius: 10px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #1db954;
      border-radius: 50%;
      cursor: pointer;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #1a1a22; }
    ::-webkit-scrollbar-thumb { background: #3a3a44; border-radius: 10px; }
  </style>
</head>
<body>
<div class="player-container">
  <div class="header">
    <div class="logo-area">
      <i class="fab fa-spotify"></i>
      <h1>SongStream</h1>
    </div>
    <div class="folder-control">
      <button class="folder-btn" id="selectFolderBtn">
        <i class="fas fa-folder-open"></i> Selecionar pasta <strong style="color:#1db954">“song”</strong>
      </button>
      <div class="info-badge" id="folderStatus">
        <i class="fas fa-music"></i> Carregando...
      </div>
    </div>
  </div>

  <div class="main-grid">
    <div class="playlist-section">
      <div class="playlist-header">
        <h3><i class="fas fa-list-ul"></i> Playlist</h3>
        <span class="track-count" id="trackCount">0 músicas</span>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Filtrar músicas..." autocomplete="off">
      </div>
      <div class="playlist-scroll" id="playlistContainer">
        <div style="text-align: center; padding: 2rem; color: #aaa;">
          <i class="fas fa-folder-music"></i><br>Carregando pasta "song"...
        </div>
      </div>
    </div>

    <div class="player-area">
      <div class="album-art">
        <div class="art-circle">
          <i class="fas fa-headphones"></i>
        </div>
      </div>
      <div class="track-details">
        <div class="current-title" id="currentTrackTitle">Nenhuma música</div>
        <div class="current-artist" id="currentTrackArtist">🎵 Aguardando playlist</div>
      </div>

      <div class="progress-area">
        <div class="time-slider" style="display: flex; gap: 12px; align-items: center;">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressSlider" value="0" step="1" min="0" max="100" style="flex:1">
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
        <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
        <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        <button class="ctrl-btn" id="repeatBtn"><i class="fas fa-redo-alt"></i></button>
      </div>

      <div class="volume-control">
        <i class="fas fa-volume-down"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" class="volume-slider">
        <i class="fas fa-volume-up"></i>
      </div>
      <div class="status-msg" id="statusMsg">
        🔍 Tentando carregar automaticamente a pasta "song"...
      </div>
    </div>
  </div>
</div>

<script>
  // ------------------- ELEMENTOS DOM -------------------
  const folderInput = document.createElement('input');
  folderInput.type = 'file';
  folderInput.setAttribute('webkitdirectory', '');
  folderInput.setAttribute('directory', '');
  folderInput.setAttribute('multiple', '');
  folderInput.style.display = 'none';
  document.body.appendChild(folderInput);

  const selectFolderBtn = document.getElementById('selectFolderBtn');
  const folderStatus = document.getElementById('folderStatus');
  const playlistContainer = document.getElementById('playlistContainer');
  const trackCountSpan = document.getElementById('trackCount');
  const searchInput = document.getElementById('searchInput');
  const currentTrackTitle = document.getElementById('currentTrackTitle');
  const currentTrackArtist = document.getElementById('currentTrackArtist');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const progressSlider = document.getElementById('progressSlider');
  const currentTimeSpan = document.getElementById('currentTime');
  const durationSpan = document.getElementById('duration');
  const volumeSlider = document.getElementById('volumeSlider');
  const statusMsgDiv = document.getElementById('statusMsg');

  // ---------- VARIÁVEIS ----------
  let allTracks = [];           // { name, displayName, url }
  let currentTrackIndex = -1;
  let audio = new Audio();
  let isPlaying = false;
  let shuffleActive = false;
  let repeatMode = 'off';       // 'off', 'all', 'one'
  let currentFilter = '';
  let filteredTracks = [];
  let currentDisplayIndices = [];
  let currentBlobUrls = [];

  // ---------- FUNÇÕES AUXILIARES ----------
  function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  function revokeAllUrls() {
    currentBlobUrls.forEach(url => URL.revokeObjectURL(url));
    currentBlobUrls = [];
  }

  function resetPlayer() {
    audio.pause();
    isPlaying = false;
    updatePlayButtonIcon();
    if (audio.src) audio.src = '';
    currentTrackIndex = -1;
    currentTrackTitle.innerText = 'Nenhuma música';
    currentTrackArtist.innerText = '🎵 Escolha uma playlist';
    progressSlider.value = 0;
    currentTimeSpan.innerText = '0:00';
    durationSpan.innerText = '0:00';
  }

  function updatePlayButtonIcon() {
    const icon = playPauseBtn.querySelector('i');
    icon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
  }

  function updateTrackInfoUI() {
    if (currentTrackIndex >= 0 && allTracks[currentTrackIndex]) {
      const track = allTracks[currentTrackIndex];
      currentTrackTitle.innerText = track.displayName;
      currentTrackArtist.innerText = `🎧 Arquivo local • ${track.name.split('.').pop().toUpperCase()}`;
    } else {
      currentTrackTitle.innerText = 'Nenhuma música';
      currentTrackArtist.innerText = '📁 Selecione uma pasta';
    }
  }

  function highlightActivePlaylist() {
    document.querySelectorAll('.playlist-item').forEach(item => {
      const url = item.getAttribute('data-track-url');
      if (currentTrackIndex >= 0 && allTracks[currentTrackIndex]?.url === url) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
  }

  function renderPlaylist() {
    if (!allTracks.length) {
      playlistContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: #aaa;">
        <i class="fas fa-folder-open"></i><br>Nenhuma música encontrada<br><span style="font-size:12px;">Clique em "Selecionar pasta song" ou verifique se os arquivos estão na pasta correta.</span>
      </div>`;
      trackCountSpan.innerText = `0 músicas`;
      return;
    }

    let filtered = allTracks;
    if (currentFilter.trim() !== '') {
      const term = currentFilter.trim().toLowerCase();
      filtered = allTracks.filter(track => track.displayName.toLowerCase().includes(term));
    }
    filteredTracks = filtered;
    currentDisplayIndices = filteredTracks.map(track => allTracks.findIndex(t => t.url === track.url));
    trackCountSpan.innerText = `${filteredTracks.length} ${filteredTracks.length === 1 ? 'música' : 'músicas'}`;

    if (filteredTracks.length === 0) {
      playlistContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: #aaa;"><i class="fas fa-search"></i> Nenhum resultado</div>`;
      return;
    }

    let html = '';
    filteredTracks.forEach((track, idx) => {
      const isActive = currentTrackIndex !== -1 && allTracks[currentTrackIndex]?.url === track.url;
      html += `
        <div class="playlist-item ${isActive ? 'active' : ''}" data-track-url="${track.url}" data-track-idx="${currentDisplayIndices[idx]}">
          <div class="track-info" style="flex:1">
            <div class="track-name">${escapeHtml(track.displayName)}</div>
            <div class="track-artist">Arquivo local</div>
          </div>
        </div>
      `;
    });
    playlistContainer.innerHTML = html;

    document.querySelectorAll('.playlist-item').forEach(el => {
      el.addEventListener('click', () => {
        const originalIdx = parseInt(el.getAttribute('data-track-idx'));
        if (!isNaN(originalIdx) && originalIdx >= 0 && originalIdx < allTracks.length) {
          playTrackByIndex(originalIdx);
        }
      });
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function playTrackByIndex(index) {
    if (index < 0 || index >= allTracks.length) return;
    currentTrackIndex = index;
    const track = allTracks[currentTrackIndex];
    audio.src = track.url;
    audio.load();
    audio.play().then(() => {
      isPlaying = true;
      updatePlayButtonIcon();
      updateTrackInfoUI();
      highlightActivePlaylist();
    }).catch(err => {
      statusMsgDiv.innerText = "⚠️ Erro ao reproduzir. Formato pode não ser suportado.";
      isPlaying = false;
      updatePlayButtonIcon();
    });
    updateTrackInfoUI();
    highlightActivePlaylist();
  }

  function playNext() {
    if (!allTracks.length) return;
    if (repeatMode === 'one' && currentTrackIndex !== -1) {
      playTrackByIndex(currentTrackIndex);
      return;
    }
    let nextIndex = -1;
    if (shuffleActive) {
      let newIdx;
      do { newIdx = Math.floor(Math.random() * allTracks.length); }
      while (allTracks.length > 1 && newIdx === currentTrackIndex);
      nextIndex = newIdx;
    } else {
      if (currentTrackIndex === -1) nextIndex = 0;
      else {
        nextIndex = currentTrackIndex + 1;
        if (nextIndex >= allTracks.length) {
          nextIndex = repeatMode === 'all' ? 0 : -1;
        }
      }
    }
    if (nextIndex !== -1) playTrackByIndex(nextIndex);
    else statusMsgDiv.innerText = "🏁 Fim da playlist. Ative repetir para loop.";
  }

  function playPrevious() {
    if (!allTracks.length) return;
    let prev = currentTrackIndex - 1;
    if (prev < 0) prev = allTracks.length - 1;
    playTrackByIndex(prev);
  }

  // ---------- CARREGAMENTO AUTOMÁTICO DA PASTA "song" ----------
  async function tryLoadSongsFromSongFolder() {
    statusMsgDiv.innerText = "🔍 Verificando pasta 'song'...";
    folderStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Carregando...`;

    try {
      // Tenta fazer fetch da pasta (funciona em servidores com listagem de diretórios)
      const response = await fetch('song/');
      if (!response.ok) throw new Error('Não foi possível listar a pasta');
      const text = await response.text();
      
      // Extrai nomes de arquivos de áudio do HTML de listagem
      const parser = new DOMParser();
      const doc = parser.parseFromString(text, 'text/html');
      const links = doc.querySelectorAll('a');
      const audioExtensions = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac'];
      const files = [];
      
      for (let link of links) {
        let href = link.getAttribute('href');
        if (href && !href.endsWith('/') && !href.startsWith('?')) {
          const ext = href.split('.').pop().toLowerCase();
          if (audioExtensions.includes(ext)) {
            files.push(href);
          }
        }
      }
      
      if (files.length === 0) throw new Error('Nenhum arquivo de áudio encontrado na pasta "song"');
      
      // Constrói URLs para cada arquivo
      const trackList = [];
      for (let fileName of files) {
        const url = `song/${encodeURIComponent(fileName)}`;
        let displayName = fileName.replace(/\.(mp3|wav|ogg|m4a|flac|aac)$/i, '');
        displayName = displayName.replace(/_spotdown\.org/g, ''); // limpa sufixo
        trackList.push({
          name: fileName,
          displayName: displayName,
          url: url
        });
      }
      
      // Substitui lista atual
      resetPlayer();
      revokeAllUrls();
      allTracks = trackList;
      currentBlobUrls = []; // não são blobs, são URLs relativas
      folderStatus.innerHTML = `<i class="fas fa-check-circle"></i> ${allTracks.length} músicas carregadas`;
      statusMsgDiv.innerHTML = `✅ Playlist carregada da pasta "song"! ${allTracks.length} músicas.`;
      renderPlaylist();
      if (allTracks.length) playTrackByIndex(0);
      
    } catch (error) {
      console.warn("Falha ao carregar automaticamente:", error);
      folderStatus.innerHTML = `<i class="fas fa-folder-open"></i> Selecione a pasta "song"`;
      statusMsgDiv.innerHTML = `📂 Não foi possível listar a pasta "song" automaticamente. Clique no botão acima e selecione a pasta "song" manualmente.`;
      playlistContainer.innerHTML = `<div style="text-align: center; padding: 2rem; color: #aaa;">
        <i class="fas fa-folder-music"></i><br>Clique em "Selecionar pasta song"<br>e escolha a pasta com suas músicas.
      </div>`;
    }
  }

  // ---------- SELEÇÃO MANUAL (webkitdirectory) ----------
  function loadSongsFromFolder(files) {
    const audioExtensions = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'webm'];
    const audioFiles = Array.from(files).filter(file => {
      const ext = file.name.split('.').pop().toLowerCase();
      return audioExtensions.includes(ext) || file.type.startsWith('audio/');
    });
    
    if (audioFiles.length === 0) {
      statusMsgDiv.innerText = "❌ Nenhum arquivo de áudio encontrado.";
      folderStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Sem músicas`;
      return;
    }
    
    resetPlayer();
    revokeAllUrls();
    allTracks = [];
    currentBlobUrls = [];
    
    audioFiles.sort((a,b) => a.name.localeCompare(b.name));
    for (const file of audioFiles) {
      const url = URL.createObjectURL(file);
      currentBlobUrls.push(url);
      let displayName = file.name.replace(/\.[^/.]+$/, "");
      displayName = displayName.replace(/_spotdown\.org/g, '');
      if (displayName.length > 45) displayName = displayName.substring(0,42)+"...";
      allTracks.push({
        name: file.name,
        displayName: displayName,
        url: url,
      });
    }
    
    folderStatus.innerHTML = `<i class="fas fa-check-circle"></i> ${allTracks.length} músicas carregadas`;
    statusMsgDiv.innerHTML = `🎵 ${allTracks.length} músicas prontas!`;
    renderPlaylist();
    if (allTracks.length) playTrackByIndex(0);
  }

  // ---------- EVENTOS ----------
  function setupAudioEvents() {
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && !isNaN(audio.duration)) {
        progressSlider.value = (audio.currentTime / audio.duration) * 100;
        currentTimeSpan.innerText = formatTime(audio.currentTime);
        durationSpan.innerText = formatTime(audio.duration);
      }
    });
    audio.addEventListener('ended', () => playNext());
    audio.addEventListener('error', () => statusMsgDiv.innerText = "Erro no arquivo de áudio.");
  }
  
  progressSlider.addEventListener('input', (e) => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });
  volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);
  
  playPauseBtn.addEventListener('click', () => {
    if (!allTracks.length) { statusMsgDiv.innerText = "Selecione uma pasta com músicas primeiro!"; return; }
    if (currentTrackIndex === -1 && allTracks.length) playTrackByIndex(0);
    else if (isPlaying) { audio.pause(); isPlaying = false; }
    else { audio.play().catch(console.warn); isPlaying = true; }
    updatePlayButtonIcon();
  });
  nextBtn.addEventListener('click', () => allTracks.length && playNext());
  prevBtn.addEventListener('click', () => allTracks.length && playPrevious());
  shuffleBtn.addEventListener('click', () => {
    shuffleActive = !shuffleActive;
    shuffleBtn.style.color = shuffleActive ? '#1db954' : '#e6e6e6';
    statusMsgDiv.innerText = shuffleActive ? "🔀 Aleatório ativado" : "➡️ Modo sequencial";
  });
  repeatBtn.addEventListener('click', () => {
    if (repeatMode === 'off') { repeatMode = 'all'; repeatBtn.style.color = '#1db954'; repeatBtn.innerHTML = '<i class="fas fa-redo-alt"></i>'; statusMsgDiv.innerText = "🔁 Repetir playlist"; }
    else if (repeatMode === 'all') { repeatMode = 'one'; repeatBtn.style.color = '#f5b042'; repeatBtn.innerHTML = '<i class="fas fa-repeat-1"></i>'; statusMsgDiv.innerText = "🔂 Repetir uma música"; }
    else { repeatMode = 'off'; repeatBtn.style.color = '#e6e6e6'; repeatBtn.innerHTML = '<i class="fas fa-redo-alt"></i>'; statusMsgDiv.innerText = "Repetição desativada"; }
  });
  searchInput.addEventListener('input', (e) => { currentFilter = e.target.value; renderPlaylist(); highlightActivePlaylist(); });
  selectFolderBtn.addEventListener('click', () => folderInput.click());
  folderInput.addEventListener('change', (event) => {
    const files = event.target.files;
    if (files.length) loadSongsFromFolder(files);
    folderInput.value = '';
  });
  
  audio.volume = 0.8;
  volumeSlider.value = 0.8;
  setupAudioEvents();
  
  // Inicializa tentando carregar a pasta "song" automaticamente
  tryLoadSongsFromSongFolder();
</script>
</body>
</html>
