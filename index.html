<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Player</title>
</head>
<body>

<h1>🎵 Minhas Músicas</h1>

<audio id="player" controls></audio>
<br><br>

<button onclick="anterior()">⏮️</button>
<button onclick="proxima()">⏭️</button>

<script>
let musicas = [];
let atual = 0;
const player = document.getElementById("player");

// Carrega lista do servidor (rota /musicas)
fetch("/musicas")
    .then(res => res.json())
    .then(lista => {
        // encode resolve espaços e caracteres especiais
        musicas = lista.map(m => "musicas/" + encodeURIComponent(m));
        tocar(0);
    })
    .catch(err => {
        console.error("Erro ao carregar músicas:", err);
        document.body.innerHTML += "<p style='color:red;'>❌ Erro ao carregar músicas. Certifique-se de que o servidor está rodando (node server.js)</p>";
    });

function tocar(i) {
    if (!musicas.length) return;

    atual = i;
    player.src = musicas[atual];

    player.play().catch(e => {
        console.log("Autoplay bloqueado pelo navegador");
    });
}

function proxima() {
    atual = (atual + 1) % musicas.length;
    tocar(atual);
}

function anterior() {
    atual = (atual - 1 + musicas.length) % musicas.length;
    tocar(atual);
}

player.addEventListener("ended", proxima);

// Debug (mostra erro se não carregar)
player.addEventListener("error", () => {
    console.error("Erro ao carregar:", musicas[atual]);
});
</script>

</body>
</html>
